name: Android

on:
  push:
    branches: [main]
    # 推送 android-v* 标签时额外发布 GitHub Release（标签推送不受下面的 paths 过滤）
    tags: ["android-v*"]
    paths: ["android/**", "Shared/Content/**", "XingXia/Resources/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "Shared/Content/**", "XingXia/Resources/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew --no-daemon :core:test

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: XingXia-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#android-v}"
          declared=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$version" != "$declared" ]; then
            echo "标签版本 $version 与 versionName $declared 不一致" >&2
            exit 1
          fi
          apk="XingXia-android-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cat > notes.md <<NOTES
          星匣 Android 版 $version（Android 8.0 及以上）。

          **安装**：下载 \`$apk\` 传到手机打开安装，首次需要在系统设置里允许「安装未知来源应用」。安装包用调试证书签名，只适合自己侧载；以后的版本如果提示与已安装的应用签名冲突，需要先卸载旧版再装（本机数据会清空）。

          功能与 iOS 版基本一致：今日运势、占卜、百宝箱 12 个工具、记录、多人档案、8 套主题、每日运势通知、桌面小组件与快捷方式。与 iOS 版的差异见仓库 README 的「Android 版」一节。
          NOTES
          gh release create "$TAG" "$apk" --title "星匣 Android $version" --notes-file notes.md --latest=false
